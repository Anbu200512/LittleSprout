<!DOCTYPE html>
<html lang="en" dir="ltr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>LittleSprout | Sign Up - Eco-Friendly Baby & Toddler Products</title>
<link rel="icon" type="image/png" href="images/logo.png">    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        primary: '#F472B6',
                        secondary: '#60A5FA',
                        accent: '#FCD34D',
                        darkBg: '#0F172A'
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                        'quicksand': ['Quicksand', 'sans-serif']
                    }
                } 
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; transition: all 0.3s ease; }
        body.light { background: #FFF9FB; }
        body.dark { background: #0F172A; }
        
        /* ===== NAVBAR (Simplified - Logo + Theme + Direction only) ===== */
        .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(244, 114, 182, 0.25); transition: all 0.3s ease; }
        .dark .navbar { background: rgba(15, 23, 42, 0.95); border-bottom-color: rgba(96, 165, 250, 0.3); }
        .nav-container { max-width: 1400px; margin: 0 auto; padding: 0.75rem 1.5rem; }
        .nav-3-part { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .nav-part-left { flex-shrink: 0; }
        .logo { display: flex; align-items: center; gap: 6px; text-decoration: none; padding: 6px 8px; transition: all 0.3s ease; }
        .logo i { font-size: 1.8rem; color: #F472B6; }
        .logo-text { font-weight: 800; font-size: 1.4rem; letter-spacing: -0.3px; font-family: 'Quicksand', monospace; white-space: nowrap; }
        .logo-text .pink { color: #F472B6; }
        .logo-text .blue { color: #60A5FA; }
        .dark .logo-text .pink { color: #F472B6; }
        .dark .logo-text .blue { color: #60A5FA; }
        
        .nav-part-right { flex-shrink: 0; display: flex; align-items: center; gap: 0.5rem; }
        .action-btn { width: 40px; height: 40px; border-radius: 40px; background: #F472B6; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; border: none; box-shadow: 0 4px 12px rgba(244, 114, 182, 0.3); flex-shrink: 0; }
        .dark .action-btn { background: #60A5FA; }
        .action-btn:hover { transform: translateY(-2px) scale(1.05); }
        
        @media (max-width: 768px) {
            .nav-container { padding: 0.5rem 1rem; }
            .logo-text { font-size: 1.1rem; white-space: nowrap; }
            .logo i { font-size: 1.3rem; }
            .action-btn { width: 34px; height: 34px; }
        }
        
        @media (max-width: 480px) {
            .logo-text { font-size: 0.9rem; }
            .logo i { font-size: 1.1rem; }
        }
        
        .main-content { padding-top: 73px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        @media (max-width: 768px) { .main-content { padding-top: 65px; } }
        
        /* Signup Form Styles */
        .signup-container {
            background: white;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            width: 100%;
            max-width: 1100px;
            margin: 2rem;
        }
        .dark .signup-container {
            background: #1E293B;
        }
        
        @media (max-width: 640px) {
            .signup-container {
                margin: 1rem;
                border-radius: 24px;
            }
        }
        
        .signup-image {
            background: linear-gradient(135deg, #F472B6, #60A5FA);
            position: relative;
            overflow: hidden;
        }
        .signup-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.9;
        }
        .signup-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.3), rgba(96, 165, 250, 0.3));
            z-index: 1;
        }
        .signup-image-content {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 2;
            color: white;
            padding: 20px;
        }
        
        @media (max-width: 1024px) {
            .signup-image-content p {
                font-size: 14px;
            }
            .signup-image-content i {
                font-size: 28px;
            }
        }
        
        .form-input:focus {
            outline: none;
            border-color: #F472B6;
            ring: 2px solid #F472B6;
        }
        .dark .form-input:focus {
            border-color: #60A5FA;
        }
        
        .social-btn {
            transition: all 0.3s ease;
        }
        .social-btn:hover {
            transform: translateY(-2px);
        }
        
        /* Prevent text wrapping on labels */
        .form-label {
            white-space: nowrap;
        }
        
        @media (max-width: 640px) {
            .form-label {
                white-space: normal;
                font-size: 13px;
            }
            .signup-container .p-8 {
                padding: 1.5rem;
            }
        }
        
        .dark, .dark * { color-scheme: dark; }
        .dark .text-gray-900, .dark .text-gray-800, .dark .text-gray-700, .dark .text-gray-600, 
        .dark .text-gray-500, .dark p, .dark h1, .dark h2, .dark h3, .dark h4, .dark li,
        .dark .font-bold, .dark .font-black { color: #F1F5F9 !important; }
        .dark .bg-white { background-color: #0F172A !important; }
        .dark .border-gray-200 { border-color: #334155 !important; }
        .dark .bg-gray-50 { background-color: #1E293B !important; }
        
        /* Fix for checkbox alignment */
        .checkbox-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .checkbox-wrapper input {
            margin-top: 2px;
            flex-shrink: 0;
        }
        .checkbox-wrapper label {
            font-size: 13px;
            line-height: 1.4;
        }
        
        @media (max-width: 480px) {
            .checkbox-wrapper label {
                font-size: 11px;
            }
        }
    </style>
</head>
<body class="light font-inter">

    <!-- Simplified Navbar - Logo + Theme + Direction only -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-3-part">
                <div class="nav-part-left">
                    <a href="index.html" class="logo">
                        <i class="fas fa-baby-carriage"></i>
                        <span class="logo-text"><span class="pink">Little</span><span class="blue">Sprout</span></span>
                    </a>
                </div>
                <div class="nav-part-right">
                    <button onclick="toggleDirection()" class="action-btn"><i class="fa-solid fa-arrow-right-arrow-left"></i></button>
                    <button onclick="toggleTheme()" class="action-btn"><i data-lucide="moon" class="w-4 h-4 dark:hidden"></i><i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="signup-container">
            <div class="grid lg:grid-cols-2">
                <!-- Left Side - Signup Form -->
                <div class="p-6 md:p-10 lg:p-12">
                    <div class="text-center mb-6 md:mb-8">
                        <h1 class="text-2xl sm:text-3xl md:text-4xl font-black text-gray-800 dark:text-white">Create Account </h1>
                        <p class="text-sm sm:text-base text-gray-500 dark:text-gray-400 mt-2">Join our eco-friendly family today</p>
                    </div>
                    
                    <form class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2 form-label">First Name</label>
                                <input type="text" class="form-input w-full px-4 py-2.5 md:py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-pink-500 focus:border-transparent transition text-sm md:text-base" placeholder="Sarah">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2 form-label">Last Name</label>
                                <input type="text" class="form-input w-full px-4 py-2.5 md:py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-pink-500 focus:border-transparent transition text-sm md:text-base" placeholder="Johnson">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2 form-label">Email Address</label>
                            <input type="email" class="form-input w-full px-4 py-2.5 md:py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-pink-500 focus:border-transparent transition text-sm md:text-base" placeholder="hello@littlesprout.com">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2 form-label">Password</label>
                            <input type="password" class="form-input w-full px-4 py-2.5 md:py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-pink-500 focus:border-transparent transition text-sm md:text-base" placeholder="Create a strong password">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2 form-label">Confirm Password</label>
                            <input type="password" class="form-input w-full px-4 py-2.5 md:py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-pink-500 focus:border-transparent transition text-sm md:text-base" placeholder="Confirm your password">
                        </div>
                        
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="terms" class="w-4 h-4 rounded border-gray-300 text-pink-500 focus:ring-pink-500">
                            <label for="terms" class="text-gray-600 dark:text-gray-400">
                                I agree to the <a href="#" class="text-pink-500 hover:underline">Terms of Service</a> and <a href="#" class="text-pink-500 hover:underline">Privacy Policy</a>
                            </label>
                        </div>
                        
                        <button type="submit" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white py-2.5 md:py-3 rounded-xl font-bold hover:opacity-90 transition shadow-lg text-sm md:text-base">Create Account →</button>
                        
                        <div class="relative my-5 md:my-6">
                            <div class="absolute inset-0 flex items-center">
                                <div class="w-full border-t border-gray-300 dark:border-gray-600"></div>
                            </div>
                            <div class="relative flex justify-center text-sm">
                                <span class="px-4 bg-white dark:bg-gray-900 text-gray-500 text-xs md:text-sm">Or sign up with</span>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <button class="social-btn flex items-center justify-center gap-2 py-2 md:py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition text-sm md:text-base">
                                <i class="fab fa-google text-red-500 text-sm md:text-base"></i>
                                <span class="text-xs md:text-sm">Google</span>
                            </button>
                            <button class="social-btn flex items-center justify-center gap-2 py-2 md:py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition text-sm md:text-base">
                                <i class="fab fa-facebook-f text-blue-600 text-sm md:text-base"></i>
                                <span class="text-xs md:text-sm">Facebook</span>
                            </button>
                        </div>
                        
                        <p class="text-center text-sm text-gray-600 dark:text-gray-400 mt-5 md:mt-6">
                            Already have an account? 
                            <a href="login.html" class="text-pink-500 font-semibold hover:underline">Sign in</a>
                        </p>
                    </form>
                </div>
                
                <!-- Right Side - Image (Hidden on mobile) -->
                <div class="signup-image relative hidden lg:block">
                    <img src="images/h2.jpg" alt="Happy baby with organic toy" class="w-full h-full object-cover">
                    <div class="signup-image-content">
                        <i class="fas fa-leaf text-3xl md:text-4xl mb-2"></i>
                        <p class="text-base md:text-lg font-semibold">Join the LittleSprout Family!</p>
                        <p class="text-xs md:text-sm opacity-90">Get 15% off your first order</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        
        function toggleTheme(){ 
            document.documentElement.classList.toggle('dark'); 
            document.body.classList.toggle('dark'); 
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); 
            setTimeout(()=>lucide.createIcons(),10); 
        }
        
        function toggleDirection(){ 
            document.documentElement.dir = document.documentElement.dir === 'rtl' ? 'ltr' : 'rtl'; 
        }
        
        if(localStorage.getItem('theme') === 'dark'){ 
            document.documentElement.classList.add('dark'); 
            document.body.classList.add('dark'); 
        }
    </script>
</body>
</html>
