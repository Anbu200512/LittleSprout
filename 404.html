<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>LittleSprout | 404 - Page Not Found</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #FFF9FB;
            min-height: 100vh;
        }
        
        .error-number {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #F472B6, #60A5FA);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-family: 'Quicksand', monospace;
        }
        
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #F472B6, #60A5FA);
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(244, 114, 182, 0.4);
        }
        
        .quick-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #f3f4f6;
            color: #374151;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .quick-link:hover {
            background: linear-gradient(135deg, #F472B6, #60A5FA);
            color: white;
            transform: translateY(-2px);
        }
        
        @media (max-width: 640px) {
            .error-number {
                font-size: 80px;
            }
            .quick-link {
                padding: 8px 16px;
                font-size: 12px;
            }
            .btn-home {
                padding: 10px 24px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="text-center max-w-2xl mx-auto">
            <!-- Logo -->
            <a href="index.html" class="inline-flex items-center gap-3 mb-8 text-decoration-none">
                <i class="fas fa-baby-carriage text-4xl text-[#F472B6]"></i>
                <span class="text-2xl font-black bg-gradient-to-r from-[#F472B6] to-[#60A5FA] bg-clip-text text-transparent">LittleSprout</span>
            </a>

            <!-- 404 Number -->
            <div class="error-number mb-4">
                404
            </div>

            <!-- Title -->
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-3">
                Page Not Found
            </h1>

            <!-- Description -->
            <p class="text-gray-500 max-w-md mx-auto mb-8">
                Oops! The page you're looking for doesn't exist or has been moved.
            </p>

            <!-- Quick Links -->
            <div class="flex flex-wrap justify-center gap-3 mb-8">
                <a href="index.html" class="quick-link">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="shop.html" class="quick-link">
                    <i class="fas fa-shopping-bag"></i> Shop
                </a>
                <a href="subscription.html" class="quick-link">
                    <i class="fas fa-gift"></i> Subscription
                </a>
                <a href="contact.html" class="quick-link">
                    <i class="fas fa-envelope"></i> Contact
                </a>
            </div>

            <!-- Back to Home Button -->
            <a href="index.html" class="btn-home">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>

            <!-- Footer -->
            <div class="mt-12 pt-6 border-t border-gray-200">
                <p class="text-xs text-gray-400">
                    © 2025 LittleSprout — Eco-Friendly Baby & Toddler Products
                </p>
            </div>
        </div>
    </div>

</body>
</html>
